  <style type="text/css">
    .hero-photo-fallback {
      background-color: #362229 !important;
    }

    /* NO CHILD COMBINATORS anywhere in this file. This CSS ships inside a
   CSS-type Replacement (EN's CSS Editor — the Template Styles block's
   head_styles), and in EN's editing surfaces `>` gets HTML-escaped to
   `&gt;` — the escaped selector is invalid CSS and the rule silently dies
   (guide §2d). Reproduced 2026-08-13 for the HTML Editor field, where an
   EDIT persists the escape; whether the CSS Editor does the same is still
   UNVERIFIED. Where the old `>` chains targeted MJML's unclassable
   structural elements, two measured idioms stand in:
   - section/column OUTER table:  table[align=center]  (only outer tables
     carry align=center in the non-MSO DOM)
   - column wrapper td (exists only when a column authors padding/border/
     background): pair td[style*=vertical-align] WITH td[valign] — EN's
     inliner moves vertical-align out of the style attribute into a valign
     attribute at send (measured 2026-08-18, EoA aafUJU…: 0 of 107 delivered
     tds kept it inline), so the style form only matches previews and the
     valign form only matches the inbox. The section's own main td:
     td[style*=direction] — direction survives inline (20 of 20 delivered).
   Attribute selectors are inert in Gmail; acceptable here because the dark
   branches never reach Gmail (no prefers-color-scheme, no [data-ogsc]) and
   the two mobile rules using them are cosmetic insets. */
    div[data-container] {
      /* Email builder compatability styles */
      max-width: 600px;
      margin: 0 auto;
    }

    /* body {
  color: #000000;
  font-family: Tahoma, sans-serif;
  font-size: 18px;
} */
    a {
      color: #006837;
    }

    /* p,
span,
a,
li {
  font-family: Tahoma, sans-serif;
} */
    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
      color: #000000;
      font-family: "Helvetica Neue", Arial, sans-serif;
    }

    h1 {
      font-size: 32px;
      line-height: 42px;
      /* 32 * 1.3 */
      mso-line-height-rule: exactly;
    }

    h2 {
      font-size: 28px;
      line-height: 36px;
      /* 28 * 1.3 */
      mso-line-height-rule: exactly;
    }

    h3 {
      font-size: 22px;
      line-height: 29px;
      /* 22 * 1.3 */
      mso-line-height-rule: exactly;
    }

    h4,
    h5,
    h6 {
      font-size: 18px;
      line-height: 29px;
      /* 18 * 1.6 */
      mso-line-height-rule: exactly;
    }

    p {
      font-size: 16px;
      line-height: 27px;
      /* 16 * 1.7 */
      mso-line-height-rule: exactly;
    }

    .wysiwyg div *:first-child {
      margin-top: 0;
    }

    .wysiwyg div *:last-child {
      margin-bottom: 0;
    }

    .two-col-column h3 {
      margin-bottom: 0;
    }

    .footer-text p,
    .footer-text span,
    .footer-text a,
    .footer-text li {
      font-size: 12px;
      line-height: 20px;
      /* font-family: Arial, sans-serif; */
      mso-line-height-rule: exactly;
    }

    /* Link colour hooks. These exist because an anchor inside an RTE Content
   value keeps its href and NOTHING else — EN's editor discards class, style,
   id, title and data-* on the first edit (measured 2026-08-19,
   docs/archive/en-anchor-attr-probe.html). The hook therefore has to sit on an
   ANCESTOR, in block markup outside the replacement. Link-only on purpose:
   .overlay already whitens headings, spans and paragraphs too, and these
   blocks need the anchor recoloured without disturbing approved copy. */
    .link-inverse a {
      color: #fff;
    }

    .link-earth a {
      color: #362229;
    }

    .link-accent a {
      color: #39b54a;
    }

    /* ProseMirror rebuilds an em element as a MARK from a fixed attribute set,
   so an inline font-family on it is dropped the first time an editor touches
   the copy — the "Section 2 Paragraph Copy" report, 2026-08-20. Ancestor-class
   styling survives (measured, docs/archive/en-headsheet-probe.html) because
   the hook lives in block markup outside the replacement. */
    .signature-text em {
      font-family: Georgia, serif;
    }

    /* The Steps Block's numbered badge. A span's CLASS survives an edit while an
   inline style is re-expressed as MARKS (measured: font-weight becomes a
   strong element, a hex becomes rgb()) — and display, background-color,
   height and border-radius have no mark to become, so the badge would lose
   its shape entirely. A class keeps the span editable as plain text. */
    .step-num {
      display: inline-block;
      background-color: #39B54A;
      color: #ffffff;
      height: 20px;
      line-height: 20px;
      text-align: center;
      font-size: 13px;
      font-weight: 700;
      font-family: Menlo, Consolas, 'Courier New', monospace;
      border-radius: 3px;
    }

    /* Footer CTAs carry more than colour. Scoped separately from .footer-text a so
   the ordinary footer links keep their own treatment. */
    .footer-cta a {
      letter-spacing: 2px;
      text-decoration: none;
    }

    /* Quiz answer pills. The styling lives here rather than inline on the anchor
   because an anchor inside an RTE Content value keeps its href and NOTHING
   else — EN's editor rebuilds links as ProseMirror marks and discards class,
   style, id, title and data-* on the first edit (measured 2026-08-19,
   docs/archive/en-anchor-attr-probe.html). The hook is on the mj-text, which
   is block markup outside the replacement, so the editor cannot reach it;
   that pattern survives an edit in storage and in the delivered email
   (docs/archive/en-headsheet-probe.html). Descendant selector, never a child
   combinator. */
    .quiz-cta a {
      display: inline-block;
      background-color: #fff;
      border-radius: 100px;
      width: 200px;
      padding: 10px 0;
      text-align: center;
      font-weight: 700;
      letter-spacing: 1px;
      text-decoration: none;
      mso-padding-alt: 0;
      white-space: nowrap;
    }

    .question-response {
      border: 1px solid #ffffff;
    }

    .question-response:hover {
      background-color: #ffffff !important;
      cursor: pointer;
    }

    .overlay h1,
    .overlay h2,
    .overlay h3,
    .overlay h4,
    .overlay h5,
    .overlay h6,
    .overlay span,
    .overlay p,
    .overlay a {
      color: #ffffff;
    }

    @media (max-width: 599px) {

      /* .desktop-only / .mobile-only are NOT here any more. The whole
     hide/reveal pair moved to the page template head on 2026-08-22 so a
     viewport fork still works in an email built without the Template Styles
     block — with this sheet absent neither half applied and BOTH copies
     rendered. The pair has to travel together and stay in order, so it is
     atomic in one style block there rather than split across two sheets. */
      /* Indents the caption (!important beats the inline td padding) */
      .caption {
        padding-left: 16px !important;
        padding-right: 16px !important;
      }

      /* Side by Side CTA Buttons */
      .cta-item {
        display: block !important;
        margin: 0 0 16px 0 !important;
      }

      .cta-item:last-child {
        margin-bottom: 0 !important;
      }

      /* Buttons center on mobile regardless of desktop alignment — a
     left-hugging button on a 375px screen reads as a layout accident.
     text-align + inline-table beats the legacy td[align] attribute. */
      td.button {
        text-align: center !important;
      }

      td.button table {
        float: none !important;
        display: inline-table !important;
        margin: 0 auto !important;
      }

      /* MJML writes the button's align onto TWO cells: the outer td.button
     (pinned above) and the inner cell holding the anchor. Without this the
     pill centers but a label that WRAPS keeps its desktop alignment
     inside it — ragged text in a centered button, and an "inert on
     mobile" control that silently comes back to life the moment the copy
     gets longer. Pin the inner cell so mobile centering is complete. */
      td.button table td {
        text-align: center !important;
      }

      .cta-group {
        text-align: center !important;
      }

      /* Fixed-width dividers and buttons span their container on narrow
     screens — a px width would force table min-width and overflow the
     viewport. Buttons opt in via css-class="button fixed-width". */
      .divider p {
        width: 100% !important;
      }

      .fixed-width table {
        width: 100% !important;
      }

      .fixed-width table a {
        width: auto !important;
      }

      .signature-img {
        width: 112px !important;
      }

      .signature-text {
        width: calc(100% - 112px) !important;
      }

      /* The column's own gutter padding lands on MJML's wrapper td. EN moves
     inline vertical-align to a valign ATTRIBUTE at send (measured
     2026-08-18, EoA aafUJU: 0 of 107 delivered tds kept it inline), so
     td[valign] is the only selector form that survives delivery. */
      .two-col-column td[valign] {
        padding: 0 !important;
      }

      /* Flush-to-edge imagery on mobile (2026-08-13, EoA dnYN8bje).
     A 240/296px card on a ~333 CSS px screen loses 80px — a quarter of the
     width — to section + column gutters, which is what the QA round read as
     "images not full bleed". The columns were never the problem: the image
     always filled its column exactly.

     `.class td` is the only selector form that survives the whole chain: EN
     escapes child combinators (2d) and Gmail ignores attribute selectors, and
     both of those failed here. The second rule puts the inset back on copy
     only, and wins because two classes outrank `.flush-mobile-capflush td`.

     SCOPE, corrected 2026-08-18: the restore rule reaches EVERY mj-text in a
     flush block, captions included — MJML stamps the template-wide wysiwyg
     css-class default onto every one, so a caption cell compiles to a table
     cell carrying class wysiwyg, and `.flush-mobile-capflush .wysiwyg`
     (0,2,0) outranks `.flush-mobile-capflush td` (0,1,1). The IMAGE goes flush; the
     copy AND its caption keep the 16px inset, which reads as a caption
     aligned to the copy rather than to the photo. An earlier note here
     claimed captions stayed flush with the photo; that was never what
     shipped. Both rules pin horizontal padding with !important either way,
     so the importer labels a caption's Inset controls desktop-only in both
     readings (conventions "Where the labels come from"). To make captions
     genuinely flush, exclude them from the restore rule — do NOT rely on the
     bare `td` rule winning, it cannot.
     Measured: image 262.7 -> 326.0 CSS, copy held at 29, desktop untouched. */
      .flush-mobile-capflush td {
        padding-left: 0 !important;
        padding-right: 0 !important;
      }

      .flush-mobile-capflush .wysiwyg {
        padding-left: 16px !important;
        padding-right: 16px !important;
      }

      /* Add space below first column on mobile when it is collapsed to single column */
      .first-column,
      .second-column {
        margin-bottom: 20px !important;
      }

      /* Image-block rhythm lives on the CAPTIONS since 2026-08-19 (user
     decision, round two): every image caption authors padding 4px 0 8px —
     Quarter above, Half below, both viewports — and the image sections
     carry no bottom padding. The mobile-only image-stack-gap classes this
     replaced are retired. */
      /* Feedback Poll option rows: pin the icon column so the mj-group
     percentage math cannot squeeze it (56px compiles to 10.4478%, which
     is 32.5px at 375px — minus the icon cell's fixed 32px gap padding
     left 0.5px of icon; measured 2026-08-19, EoA B4uCpmh6). Same calc
     pattern as .signature-img/.signature-text above. */
      .poll-icon {
        width: 56px !important;
      }

      .poll-text {
        width: calc(100% - 56px) !important;
      }

      /* Podcast Streaming Block: the two "listen on" badges are a MATCHED PAIR,
     and only the Apple one carries an inset (padding="0 0 0 16px") to space
     it off Spotify. Both 78px columns are pinned above the breakpoint, so at
     600px that inset sits in the column's slack and both badges render 62px.
     Below it the columns go percentage — 45px at 375 — and the same 16px
     inset eats a third of one badge but not the other: measured 45px vs 29px
     at 375, 37 vs 21 at 320 (2026-08-21). Pinning both columns holds each
     badge at its authored 62px AND keeps the 16px gap.

     Deleting the inset instead was measured and rejected: it fixes the sizes
     but drops the gap to 0 and the two circles touch. */
      .stream-icon {
        width: 78px !important;
      }

      .stream-text {
        width: calc(100% - 156px) !important;
      }

      /* Icon-beside-text rows: the icon column is authored in px, so below the
     breakpoint it goes percentage and the icon shrinks harder than the row
     does — 100px to 54px on Icon Row, 92px to 49px on Podcast Episode
     (measured 2026-08-21). Nothing looks broken, because each row has ONE
     icon with no sibling to be measured against, which is why these three
     were left until last. Pinned to their AUTHORED widths, as .poll-icon,
     .signature-img and .stream-icon already are.

     The cost is text width: Icon Row and Podcast Episode lose ~50px of
     column and grow 25% / 50% taller. Steps Block pays nothing — its arrow
     is 70px in a 104px content box, so it had slack and the text reflows
     identically. Icon Row and Steps Block share the 120px selector. */
      .icon-row-icon,
      .step-icon {
        width: 120px !important;
      }

      .icon-row-text,
      .step-text {
        width: calc(100% - 120px) !important;
      }

      .episode-icon {
        width: 112px !important;
      }

      .episode-text {
        width: calc(100% - 112px) !important;
      }

      /* Inset sections: collapse the wide desktop gutters to the standard 32px.
     The section's main td is the only one carrying direction inline. */
      .inset-gutter td[style*=direction] {
        padding-left: 32px !important;
        padding-right: 32px !important;
      }
    }

    /* dark mode styles */
    :root {
      color-scheme: light dark;
      supported-color-schemes: light dark;
    }

    .dark-only {
      display: none;
    }

    /* Outlook.com dark mode. EN's CSS inliner DELETES [data-ogsc] rules that sit
   at top level (measured — see MJML-AUTHORING-GUIDE.md §2), so the whole
   branch lives inside a conditional media query: EN returns anything nested
   in one verbatim. The condition must be un-evaluable — a bare @media screen
   is flattened and inlined instead. Every declaration keeps !important
   because the base rules ARE inlined onto the elements (§2b).
   OWA mirrors the media query below; backgrounds must come along with the
   forced white text or light footers render white-on-light. */
    @media only screen and (max-width: 9999px) {
      [data-ogsc] .dark-only {
        display: block !important;
      }

      [data-ogsc] .light-only {
        display: none !important;
      }

      [data-ogsc] .block,
      [data-ogsc] .block table[align=center],
      [data-ogsc] .spacer-block td {
        background-color: #000000 !important;
      }

      [data-ogsc] .image-block table[align=center],
      [data-ogsc] .overlay-image-block table[align=center] {
        background-color: transparent !important;
      }

      [data-ogsc] .caption-panel,
      [data-ogsc] .highlighted-text-column td[valign],
      [data-ogsc] .stat-row-column td[valign] {
        background-color: #000000 !important;
      }

      [data-ogsc] .social-link table {
        background-color: #000000 !important;
      }

      [data-ogsc] a {
        color: #8CC63F !important;
      }

      [data-ogsc] .wysiwyg h1,
      [data-ogsc] .wysiwyg h2,
      [data-ogsc] .wysiwyg h3,
      [data-ogsc] .wysiwyg h4,
      [data-ogsc] .wysiwyg h5,
      [data-ogsc] .wysiwyg h6,
      [data-ogsc] .block h1,
      [data-ogsc] .block h2,
      [data-ogsc] .block h3,
      [data-ogsc] .block h4,
      [data-ogsc] .block h5,
      [data-ogsc] .block h6,
      [data-ogsc] .block p,
      [data-ogsc] .block span,
      [data-ogsc] .block li,
      [data-ogsc] .block div,
      [data-ogsc] .quote-block p,
      [data-ogsc] .footer-block p {
        color: #ffffff !important;
      }

      [data-ogsc] .email-body {
        color: #ffffff !important;
        background-color: #000000 !important;
      }

      [data-ogsc] .button td,
      [data-ogsc] .button a {
        background-color: #006837 !important;
        border-color: #006837 !important;
        color: #ffffff !important;
      }

      [data-ogsc] .two-line-cta a,
      [data-ogsc] .two-line-cta a span {
        color: #000000 !important;
      }

      [data-ogsc] .divider p {
        border-color: #ffffff !important;
      }

      [data-ogsc] .question-response {
        background-color: #000000 !important;
        border-color: #000000 !important;
        color: #ffffff !important;
      }

      [data-ogsc] .question-response p a {
        color: #ffffff !important;
      }
    }

    @media (prefers-color-scheme: dark) {
      .light-only {
        display: none !important;
      }

      .dark-only {
        display: block !important;
      }

      body,
      .email-body {
        color: #ffffff !important;
        background-color: #000000 !important;
      }

      a {
        color: #8CC63F !important;
      }

      .wysiwyg h1,
      .wysiwyg h2,
      .wysiwyg h3,
      .wysiwyg h4,
      .wysiwyg h5,
      .wysiwyg h6 {
        color: #ffffff !important;
      }

      .quote-block p,
      .footer-block p {
        color: #ffffff !important;
      }

      /* table[align=center] = the section's outer table only (it carries the
     authored background inline). Bonus over the old `>` form: it also
     reaches background-image sections, whose outer table sits under an
     extra positioning div the child combinator never crossed. */
      .block,
      .block table[align=center],
      .spacer-block td {
        background-color: #000000 !important;
      }

      /* Background-photo heroes: the .block repaint above would paint an opaque
     black lid over the photo. EN's send-time shorthand rebuild strips the
     url() from the hero section's outer table (measured, delivered payload
     0Mgmjr…), so the photo lives on the DIV behind it — the table must stay
     see-through. Convicted by controlled A/B 2026-08-18: P1 as-shipped =
     black slab, P2 identical-minus-`block` = photo, Apple Mail dark AND
     Outlook.com dark. Equal specificity, later in the sheet, so it wins.
     Confirmed 2026-08-18 (probe MeKGcu…): all five hero shapes photo in
     Apple Mail dark and Outlook.com dark with this exemption live. */
      .image-block table[align=center],
      .overlay-image-block table[align=center] {
        background-color: transparent !important;
      }

      /* Two shapes, and the difference is load-bearing. A column's
     background-color lands on a td whose class sits on the PARENT div, so it
     needs the descendant form; a container-background-color lands on the
     element's OWN classed td, so `.advocacy-box` is bare. `.block` only ever
     has a table[align=center] descendant form, never td, which is why a
     column ground is never covered by it (audit 2026-08-15). */
      .caption-panel,
      .highlighted-text-column td[valign],
      .stat-row-column td[valign] {
        background-color: #000000 !important;
      }

      /* Blocks force a black background above, but much of the catalog authors
     its text color inline (dark ink on light section colors) — that ink is
     invisible on black unless overridden here. Exceptions re-assert below. */
      .block h1,
      .block h2,
      .block h3,
      .block h4,
      .block h5,
      .block h6,
      .block p,
      .block span,
      .block li,
      /* mj-text compiles to a div carrying inline color — text authored without
     a paragraph/span wrapper is only reachable here */
      .block div {
        color: #ffffff !important;
      }

      .button td,
      .button a {
        background-color: #006837 !important;
        border-color: #006837 !important;
        color: #ffffff !important;
      }

      /* Two-line pills keep their authored colored chips; black text stays
     readable on both chip colors where forced-white would fail on orange */
      .two-line-cta a,
      .two-line-cta a span {
        color: #000000 !important;
      }

      .social-link table {
        background-color: #000000 !important;
      }

      .divider p {
        border-color: #ffffff !important;
      }

      /* Tri-color divider: intentionally NOT adapted — its three brand-color
     bars (orange/green/teal, authored as spacer td backgrounds) read fine
     on black. Only the single-color divider above inverts. */
      /* Border matches the repainted ground so dark mirrors light's
     invisible-border behavior — the old #eee drew a visible outline around
     the Question Block on black (user decision 2026-08-19, EoA 8ryXNAL). */
      .question-response {
        background-color: #000000 !important;
        border-color: #000000 !important;
        color: #ffffff !important;
      }

      .question-response p a {
        color: #ffffff !important;
      }

      .question-response:hover {
        background-color: #000000 !important;
        cursor: pointer;
      }
    }

    /* table/td.mj-full-width-mobile width rules are MJML-emitted wherever a
   fluid image exists — only the img height reset is authored here */
    @media only screen and (max-width:599px) {
      td.mj-full-width-mobile img {
        height: auto !important;
      }
    }
  </style>

    } -->
  <!--
      BLOCKS UNDER REPAIR — not a catalog page, not shipped.

      A holding pen for blocks pulled out of main.mjml while something about
      them is unresolved. It carries main's head verbatim (the en-tools-config,
      the builder-band sheet, styles.css) so a block behaves here exactly as it
      did there — the point is to look at it in isolation, not in a different
      environment.

      Moving a block here has three consequences worth knowing:
        * it stops exporting, so EN never sees it;
        * its versions.json entity disappears — version-sync hashes blocks from
          main.mjml alone — so returning it later restarts its version at v1;
        * it is still a compiled page, so every check-catalog guard still
          applies to it. That is deliberate: a block under repair is exactly
          the one you want linted.

      Put a block back by moving its START/END region into main.mjml under the
      right Category band. When this file is empty, delete it.
    -->
  <!-- No mj-preview: EN injects its own hidden preheader from each email's Preview Text setting (measured 2026-08-10) — a template-baked one would double up in inbox snippets. Autoresponder sources (donation-thank-you) keep theirs; they do not go out through Marketing Tools broadcasts. -->
  <!-- Baseline everything inherits -->
  <!-- No mj-style @media blocks here: EN merges same-condition @media
         blocks into the FIRST occurrence's position (measured 2026-08-19,
         EoA delivered heads), so a 599px block in this head would drag
         styles.css's 599px rules ahead of the order-dependent hides that
         precede them there. All mobile rules live in styles.css. -->
  <meta name="color-scheme" content="light dark" />
  <meta name="supported-color-schemes" content="light dark" />
  <meta name="format-detection" content="telephone=no" />
  <!-- Marketing Tools builder bands. The data-en-tools-band attribute keeps
         this sheet in the template HEAD: the importer splices every other
         style element out into the Template Styles block, and this layout has
         to survive an email built without that block. __TEMPLATE_VERSION__ is
         filled in at import from versions.json; keeping the literal here is
         what stops the version from feeding its own hash.

         TWO SEPARATE RULES, DELIBERATELY NOT MERGED INTO ONE SELECTOR LIST.

         BLOCK bands hang off a span the app injects into the block's own
         content, gated on whether a block wrapper exists anywhere in the
         document — true while editing in EN, false in a delivered email.

         The TEMPLATE band hangs off EN's container element instead. A span
         authored in the template shell does NOT work (measured 2026-08-20):
         EN's builder renders blocks inside the container and does not render
         the template's own surrounding markup, so such a span never enters
         the builder DOM at all. [data-container="main"] IS that container,
         and it is self-gating — the stored template carries EN's container
         placeholder there and a delivered email carries the blocks
         themselves, so nothing bears the attribute outside the editor.

         Do NOT write EN's container merge tag literally anywhere in this
         file. autoEnableTemplateReplacements splits the shell on the FIRST
         occurrence of that tag, so a literal in a comment splits the head at
         the comment instead of at the real container: the comment loses its
         terminator, swallows the whole stylesheet, and every light/dark image
         pair renders both halves. Measured 2026-08-20; check-catalog guards it.

         Merging the two selectors would be a live hazard: one unsupported
         selector in a group invalidates the WHOLE rule, so a client that
         cannot parse :has() would take the template band down with it. -->
  <style type="text/css" data-en-tools-band>
    /* The TEMPLATE's own band leads, because it labels the whole email
           rather than a block inside it. Order is presentational only — the
           two selectors match different elements, so nothing in the cascade
           depends on it. */
    [data-container="main"]:before {
      content: "Email Template v__TEMPLATE_VERSION__";
      display: block !important;
      font-weight: 700 !important;
      font-family: sans-serif !important;
      color: #4e535c !important;
      line-height: 1.75rem !important;
      text-align: center !important;
      margin-bottom: 2rem !important;
      background-color: #d0d5dd !important;
    }

    /* max-width tracks the EMAIL width — keep it equal to
           div[data-container]{max-width} in styles.css, or the block band
           stops centring over the column it labels. check-catalog's
           "Builder band width tracks the email width" guard enforces it. */
    :is(body):has(.en__emailbuilder__block) .marketing-tools-banner {
      display: flex !important;
      font-weight: 700 !important;
      font-family: sans-serif !important;
      color: #4e535c !important;
      line-height: 2rem !important;
      top: 1.75rem !important;
      width: 100% !important;
      max-width: 600px !important;
      justify-content: center !important;
      background-color: #d0d5dd !important;
    }

    /* position:absolute belongs to the CSS Styles Block band ALONE (user
           decision 2026-08-21). That block's real content is a <style>, so it
           has no height of its own to sit above and the band has to be lifted
           out of flow; every other band labels a block with visible content,
           where taking the label out of flow makes it overlap what it labels.
           Targeted by id rather than a new class: each band span already
           carries a unique one — #head-styles and #raw-html, from
           STYLES_BAND_ID and RAW_HTML_BAND_ID — and those ids are baked into
           the stored content of blocks already living in EN, so minting new
           ones would desync every uploaded copy. Its own rule, never merged
           into the selector list above: one unparseable selector discards the
           WHOLE rule, and this gate is exactly the kind an older engine may
           not parse (conventions.md, "Builder bands"). */
    :is(body):has(.en__emailbuilder__block) #head-styles {
      position: absolute !important;
    }
  </style>

         parked below, so a rule in the shared sheet shipped ~100 delivered

         background-color to transparent. Behind the photo in every CSS client;
         Outlook's blocked-image behaviour is unverified (2026-08-21). -->
</head>
