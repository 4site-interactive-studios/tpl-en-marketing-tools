    /* NO CHILD COMBINATORS anywhere in this file. This CSS ships inside a
   CSS-type Replacement (EN's CSS Editor — the Template Styles block's
   head_styles), and in EN's editing surfaces `>` gets HTML-escaped to
   `&gt;` — the escaped selector is invalid CSS and the rule silently dies
   (guide §2d). Reproduced 2026-08-13 for the HTML Editor field, where an
   EDIT persists the escape; whether the CSS Editor does the same is still
   UNVERIFIED. Where the old `>` chains targeted MJML's unclassable
   structural elements, two measured idioms stand in:
   - section/column OUTER table:  table[align=center]  (only outer tables
     carry align=center in the non-MSO DOM)
   - column wrapper td (exists only when a column authors padding/border/
     background): td[style*=vertical-align] — widget tds never carry
     vertical-align inline; the section's own main td: td[style*=direction].
   Attribute selectors are inert in Gmail; acceptable here because the dark
   branches never reach Gmail (no prefers-color-scheme, no [data-ogsc]) and
   the two mobile rules using them are cosmetic insets. */

      /* Email builder compatability styles */
      max-width: 600px;
      margin: 0 auto;

      /* Flush-to-edge imagery on mobile (2026-08-13, EoA dnYN8bje).

     width — to section + column gutters, which is what the QA round read as
     "images not full bleed". The columns were never the problem: the image
     always filled its column exactly.

     `.class td` is the only selector form that survives the whole chain: EN
     escapes child combinators (2d) and Gmail ignores attribute selectors, and
     both of those failed here. The second rule puts the inset back on copy

  <!--
      PROBE — Outlook desktop dark-mode footer inversion (2026-08-13).
      Not a catalog page. Send dist/probe_outlook-dark-footer_live.html through
      EN to EoA. The ONLY clients that matter here are the DARK Word-engine
      ones: outlook2021_win11_dm_dt and m365_w11_dm_dt. Check the light twins
      too, purely as a regression check.

      THE FINDING
      QA (2026-08-12): "Outlook on desktop has a pink background but doesn't
      show the logo with dark text, instead it's white text on pink."

      THE MECHANISM
      The footer is background-color #362229 (plum) carrying a light-green
      wordmark — correct pairing on a dark ground. Outlook desktop dark mode
      inverts BACKGROUND COLOURS but never touches IMAGES, and neither of our
      swap hooks reaches it (prefers-color-scheme is unsupported; [data-ogsc]
      is Outlook.com only). So the plum inverts to pink, the pale wordmark
      does not change, and the mark goes pale-on-pale. `bgcolor` attributes do
      NOT resist the inversion — already measured, 2026-08-11.

      WHY THIS MAY ALREADY BE FIXED
      The contrast-outline treatment shipped AFTER that QA round (TPL
      claude/contrast-outline-assets, merged 2026-08-13). Every transparent
      lettering asset now carries a rim in the opposite polarity of its ink,
      so a pale wordmark has a dark rim that stays legible when the ground
      flips. The footer logo went 7104 -> 15381 bytes in that pass. F1 is
      therefore a re-test of the original complaint against current assets,
      not a new experiment.

      VARIANTS

        F1 AS SHIPPED    plum background-color + the outlined wordmark.
                         If the rim holds on the inverted pink ground, this
                         item closes with no code change.
        F2 IMAGE GROUND  the same footer whose plum comes from a background
                         IMAGE instead of a colour. Outlook cannot invert an
                         image, so the ground should stay dark and the
                         pairing stays correct. Uses the black swatch already live on the
                         CDN (confirmed working across clients, 2026-08-12)
                         and now carried in src/assets so the source stays
                         relative; production would use a plum equivalent.
                         Section carries background-url ONLY with the fallback
                         colour on an mj-wrapper — the shape proven in probe
                         aBPD6k1l, so the Word engine paints the image rather
                         than the fallback.

      VERDICT RULE
      1. If F1's wordmark is legible on the pink ground, the outline already
         solved it — ship nothing, close the finding.
      2. If F1 fails and F2's ground stays DARK with a legible wordmark, adopt
         the image-ground technique for dark footers and generate a plum
         swatch asset.
      3. If both fail, Outlook desktop dark is doing something neither an
         asset nor a ground can reach, and the honest answer is to accept it
         and document the limitation.
    -->

  <script type="application/json" data-tpl-raw-source>
    {
      "source": "<mjml lang=\"en\">\n  <mj-head>\n    <!--\n      PROBE — Outlook desktop dark-mode footer inversion (2026-08-13).\n      Not a catalog page. Send dist/probe_outlook-dark-footer_live.html through\n      EN to EoA. The ONLY clients that matter here are the DARK Word-engine\n      ones: outlook2021_win11_dm_dt and m365_w11_dm_dt. Check the light twins\n      too, purely as a regression check.\n\n      THE FINDING\n      QA (2026-08-12): \"Outlook on desktop has a pink background but doesn't\n      show the logo with dark text, instead it's white text on pink.\"\n\n      THE MECHANISM\n      The footer is background-color #362229 (plum) carrying a light-green\n      wordmark — correct pairing on a dark ground. Outlook desktop dark mode\n      inverts BACKGROUND COLOURS but never touches IMAGES, and neither of our\n      swap hooks reaches it (prefers-color-scheme is unsupported; [data-ogsc]\n      is Outlook.com only). So the plum inverts to pink, the pale wordmark\n      does not change, and the mark goes pale-on-pale. `bgcolor` attributes do\n      NOT resist the inversion — already measured, 2026-08-11.\n\n      WHY THIS MAY ALREADY BE FIXED\n      The contrast-outline treatment shipped AFTER that QA round (TPL\n      claude/contrast-outline-assets, merged 2026-08-13). Every transparent\n      lettering asset now carries a rim in the opposite polarity of its ink,\n      so a pale wordmark has a dark rim that stays legible when the ground\n      flips. The footer logo went 7104 -> 15381 bytes in that pass. F1 is\n      therefore a re-test of the original complaint against current assets,\n      not a new experiment.\n\n      VARIANTS\n\n        F1 AS SHIPPED    plum background-color + the outlined wordmark.\n                         If the rim holds on the inverted pink ground, this\n                         item closes with no code change.\n        F2 IMAGE GROUND  the same footer whose plum comes from a background\n                         IMAGE instead of a colour. Outlook cannot invert an\n                         image, so the ground should stay dark and the\n                         pairing stays correct. Uses the black swatch already live on the\n                         CDN (confirmed working across clients, 2026-08-12)\n                         and now carried in src/assets so the source stays\n                         relative; production would use a plum equivalent.\n                         Section carries background-url ONLY with the fallback\n                         colour on an mj-wrapper — the shape proven in probe\n                         aBPD6k1l, so the Word engine paints the image rather\n                         than the fallback.\n\n      VERDICT RULE\n      1. If F1's wordmark is legible on the pink ground, the outline already\n         solved it — ship nothing, close the finding.\n      2. If F1 fails and F2's ground stays DARK with a legible wordmark, adopt\n         the image-ground technique for dark footers and generate a plum\n         swatch asset.\n      3. If both fail, Outlook desktop dark is doing something neither an\n         asset nor a ground can reach, and the honest answer is to accept it\n         and document the limitation.\n    -->\n    <mj-breakpoint width=\"600px\" />\n    <mj-title>PROBE — Outlook dark footer<\/mj-title>\n\n    <mj-attributes>\n      <mj-text\n        color=\"#ffffff\"\n        font-size=\"18px\"\n        font-weight=\"400\"\n        font-family=\"Tahoma, sans-serif\"\n        line-height=\"24px\"\n        css-class=\"wysiwyg\"\n      />\n      <mj-image padding=\"0\" />\n    <\/mj-attributes>\n\n    <mj-raw>\n      <meta name=\"color-scheme\" content=\"light dark\" />\n      <meta name=\"supported-color-schemes\" content=\"light dark\" />\n      <meta name=\"format-detection\" content=\"telephone=no\" />\n    <\/mj-raw>\n    <mj-include path=\"./styles.css\" type=\"css\" />\n  <\/mj-head>\n\n  <mj-body css-class=\"email-body\" background-color=\"#ffffff\">\n\n    <!-- START: Footer Label F1 -->\n    <mj-section css-class=\"text-block block\" background-color=\"#000000\" padding=\"8px 32px\">\n      <mj-column>\n        <mj-text align=\"center\" padding=\"0\">\n          <p style=\"font-size:14px;font-weight:700;letter-spacing:3px;color:#8DC63F;font-family:Menlo,Consolas,monospace;\">F1 — AS SHIPPED (COLOUR GROUND)<\/p>\n        <\/mj-text>\n      <\/mj-column>\n    <\/mj-section>\n    <!-- END: Footer Label F1 -->\n\n    <!-- START: Footer F1 As Shipped -->\n    <mj-section css-class=\"footer-block block\" background-color=\"#362229\" padding=\"32px\">\n      <mj-column>\n        <mj-image src=\"assets/text-and-arrow_2.png\" alt=\"Supporters like you make our work possible\" width=\"225px\" align=\"center\" padding=\"0 0 16px\" />\n        <mj-image css-class=\"light-only\" src=\"assets/logo-tpl_color-light-green-text.png\" alt=\"Trust for Public Land\" width=\"130px\" align=\"center\" padding=\"0 0 8px\" />\n        <mj-raw><!--[if !mso]><!--><\/mj-raw>\n        <mj-image css-class=\"dark-only\" src=\"assets/logo-tpl_color-light-green-text.png\" alt=\"Trust for Public Land\" width=\"130px\" align=\"center\" padding=\"0 0 8px\" />\n        <mj-raw><!--<![endif]--><\/mj-raw>\n        <mj-text align=\"center\" padding=\"0\" font-size=\"12px\">F1 — is this wordmark legible on the inverted ground?<\/mj-text>\n      <\/mj-column>\n    <\/mj-section>\n    <!-- END: Footer F1 As Shipped -->\n\n    <!-- START: Footer Label F2 -->\n    <mj-section data-fully-exclude css-class=\"text-block block\" background-color=\"#000000\" padding=\"8px 32px\">\n      <mj-column>\n        <mj-text align=\"center\" padding=\"0\">\n          <p style=\"font-size:14px;font-weight:700;letter-spacing:3px;color:#8DC63F;font-family:Menlo,Consolas,monospace;\">F2 — IMAGE GROUND (UNINVERTIBLE)<\/p>\n        <\/mj-text>\n      <\/mj-column>\n    <\/mj-section>\n    <!-- END: Footer Label F2 -->\n\n    <!-- START: Footer F2 Image Ground -->\n    <mj-wrapper background-color=\"#362229\" padding=\"0\">\n      <mj-section\n        css-class=\"footer-block block\"\n        background-url=\"assets/bg-000000.png\"\n        background-size=\"cover\"\n        background-repeat=\"repeat\"\n        background-position=\"center center\"\n        padding=\"32px\"\n      >\n        <mj-column>\n          <mj-image src=\"assets/text-and-arrow_2.png\" alt=\"Supporters like you make our work possible\" width=\"225px\" align=\"center\" padding=\"0 0 16px\" />\n          <mj-image css-class=\"light-only\" src=\"assets/logo-tpl_color-light-green-text.png\" alt=\"Trust for Public Land\" width=\"130px\" align=\"center\" padding=\"0 0 8px\" />\n          <mj-raw><!--[if !mso]><!--><\/mj-raw>\n          <mj-image css-class=\"dark-only\" src=\"assets/logo-tpl_color-light-green-text.png\" alt=\"Trust for Public Land\" width=\"130px\" align=\"center\" padding=\"0 0 8px\" />\n          <mj-raw><!--<![endif]--><\/mj-raw>\n          <mj-text align=\"center\" padding=\"0\" font-size=\"12px\">F2 — did this ground stay DARK in Outlook dark mode?<\/mj-text>\n        <\/mj-column>\n      <\/mj-section>\n    <\/mj-wrapper>\n    <!-- END: Footer F2 Image Ground -->\n\n  <\/mj-body>\n<\/mjml>\n",
      "includes": {
        "./styles.css": "/* NO CHILD COMBINATORS anywhere in this file. This CSS ships inside a\n   CSS-type Replacement (EN's CSS Editor — the Template Styles block's\n   head_styles), and in EN's editing surfaces `>` gets HTML-escaped to\n   `&gt;` — the escaped selector is invalid CSS and the rule silently dies\n   (guide §2d). Reproduced 2026-08-13 for the HTML Editor field, where an\n   EDIT persists the escape; whether the CSS Editor does the same is still\n   UNVERIFIED. Where the old `>` chains targeted MJML's unclassable\n   structural elements, two measured idioms stand in:\n   - section/column OUTER table:  table[align=center]  (only outer tables\n     carry align=center in the non-MSO DOM)\n   - column wrapper td (exists only when a column authors padding/border/\n     background): td[style*=vertical-align] — widget tds never carry\n     vertical-align inline; the section's own main td: td[style*=direction].\n   Attribute selectors are inert in Gmail; acceptable here because the dark\n   branches never reach Gmail (no prefers-color-scheme, no [data-ogsc]) and\n   the two mobile rules using them are cosmetic insets. */\n\ndiv[data-container] {\n  /* Email builder compatability styles */\n  max-width: 600px;\n  margin: 0 auto;\n}\n\n/* body {\n  color: #000000;\n  font-family: Tahoma, sans-serif;\n  font-size: 18px;\n} */\n\na {\n  color: #006837;\n}\n\n/* p,\nspan,\na,\nli {\n  font-family: Tahoma, sans-serif;\n} */\n\nh1,\nh2,\nh3,\nh4,\nh5,\nh6 {\n  color: #000000;\n  font-family: \"Helvetica Neue\", Arial, sans-serif;\n}\n\nh1 {\n  font-size: 32px;\n  line-height: 42px; /* 32 * 1.3 */\n  mso-line-height-rule: exactly;\n}\n\nh2 {\n  font-size: 28px;\n  line-height: 36px; /* 28 * 1.3 */\n  mso-line-height-rule: exactly;\n}\n\nh3 {\n  font-size: 22px;\n  line-height: 29px; /* 22 * 1.3 */\n  mso-line-height-rule: exactly;\n}\n\nh4,\nh5,\nh6 {\n  font-size: 18px;\n  line-height: 29px; /* 18 * 1.6 */\n  mso-line-height-rule: exactly;\n}\n\np {\n  font-size: 16px;\n  line-height: 27px; /* 16 * 1.7 */\n  mso-line-height-rule: exactly;\n}\n\n.wysiwyg div *:first-child {\n  margin-top: 0;\n}\n\n.wysiwyg div *:last-child {\n  margin-bottom: 0;\n}\n\n.mobile-only {\n  display: none !important;\n}\n\n.two-col-column h3 {\n  margin-bottom: 0;\n}\n\n.footer-text p,\n.footer-text span,\n.footer-text a,\n.footer-text li {\n  font-size: 12px;\n  line-height: 20px;\n  /* font-family: Arial, sans-serif; */\n  mso-line-height-rule: exactly;\n}\n\n.question-response {\n  border: 1px solid #ffffff;\n}\n\n.question-response:hover {\n  background-color: #ffffff!important;\n  cursor: pointer;\n}\n\n.overlay h1,\n.overlay h2,\n.overlay h3,\n.overlay h4,\n.overlay h5,\n.overlay h6,\n.overlay span,\n.overlay p,\n.overlay a {\n  color: #ffffff;\n}\n\n\n\n/* .caption {\n  font-size: 10px;\n  line-height: 16px;\n  font-style: italic;\n} */\n\n@media (max-width: 599px) {\n  .desktop-only {\n    display: none !important;\n  }\n\n  /* Buttons center on mobile regardless of desktop alignment — a\n     left-hugging button on a 375px screen reads as a layout accident.\n     text-align + inline-table beats the legacy td[align] attribute. */\n  td.button {\n    text-align: center !important;\n  }\n\n  td.button table {\n    float: none !important;\n    display: inline-table !important;\n    margin: 0 auto !important;\n  }\n\n  /* MJML writes the button's align onto TWO cells: the outer td.button\n     (pinned above) and the inner cell holding the <a>. Without this the\n     pill centers but a label that WRAPS keeps its desktop alignment\n     inside it — ragged text in a centered button, and an \"inert on\n     mobile\" control that silently comes back to life the moment the copy\n     gets longer. Pin the inner cell so mobile centering is complete. */\n  td.button table td {\n    text-align: center !important;\n  }\n\n  .cta-group {\n    text-align: center !important;\n  }\n\n  /* Fixed-width dividers and buttons span their container on narrow\n     screens — a px width would force table min-width and overflow the\n     viewport. Buttons opt in via css-class=\"button fixed-width\". */\n  .divider p {\n    width: 100% !important;\n  }\n\n  .fixed-width table {\n    width: 100% !important;\n  }\n\n  .fixed-width table a {\n    width: auto !important;\n  }\n\n  .signature-img {\n    width: 110px !important;\n  }\n\n  .signature-text {\n    width: calc(100% - 110px) !important;\n  }\n\n  /* The handwriting graphic reads oversized next to the shrunken photo */\n  .signature-text img {\n    width: 140px !important;\n    height: auto !important;\n  }\n\n  /* The column's own gutter padding lands on MJML's wrapper td — the only\n     td under the column carrying vertical-align inline (see header note) */\n  .two-col-column td[style*=vertical-align] {\n    padding: 0 !important;\n  }\n\n  /* Flush-to-edge imagery on mobile (2026-08-13, EoA dnYN8bje).\n     A 240/296px card on a ~333 CSS px screen loses 80px — a quarter of the\n     width — to section + column gutters, which is what the QA round read as\n     \"images not full bleed\". The columns were never the problem: the image\n     always filled its column exactly.\n\n     `.class td` is the only selector form that survives the whole chain: EN\n     escapes child combinators (2d) and Gmail ignores attribute selectors, and\n     both of those failed here. The second rule puts the inset back on copy\n     only, and wins because two classes outrank `.flush-mobile-capflush td`.\n     Captions are deliberately NOT in that list — they stay flush with the\n     photo, which is the alignment the catalog authors (padding=\"8px 0 0\").\n     Measured: image 262.7 -> 326.0 CSS, copy held at 29, desktop untouched. */\n  .flush-mobile-capflush td {\n    padding-left: 0 !important;\n    padding-right: 0 !important;\n  }\n\n  .flush-mobile-capflush .wysiwyg {\n    padding-left: 16px !important;\n    padding-right: 16px !important;\n  }\n\n  /* Add space below image on mobile when it is collapsed to single column */\n  .two-col-image table {\n    margin-bottom: 15px !important;\n  }\n\n  /* Add space below first column on mobile when it is collapsed to single column */\n  .first-column,\n  .second-column {\n    margin-bottom: 20px !important;\n  }\n\n  /* Inset sections: collapse the wide desktop gutters to the standard 32px.\n     The section's main td is the only one carrying direction inline. */\n  .inset-gutter td[style*=direction] {\n    padding-left: 32px !important;\n    padding-right: 32px !important;\n  }\n\n  .question-response-symbol {\n    width: 40px !important;\n  }\n\n  .question-response-text {\n    width: calc(100% - 40px) !important;\n  }\n}\n\n/* dark mode styles */\n:root {\n  color-scheme: light dark;\n  supported-color-schemes: light dark;\n}\n\n.dark-only {\n  display: none;\n}\n\n/* Outlook.com dark mode. EN's CSS inliner DELETES [data-ogsc] rules that sit\n   at top level (measured — see MJML-AUTHORING-GUIDE.md §2), so the whole\n   branch lives inside a conditional media query: EN returns anything nested\n   in one verbatim. The condition must be un-evaluable — a bare @media screen\n   is flattened and inlined instead. Every declaration keeps !important\n   because the base rules ARE inlined onto the elements (§2b).\n   OWA mirrors the media query below; backgrounds must come along with the\n   forced white text or light footers render white-on-light. */\n@media only screen and (max-width: 9999px) {\n  [data-ogsc] .dark-only {\n    display: block !important;\n  }\n\n  [data-ogsc] .light-only {\n    display: none !important;\n  }\n\n  [data-ogsc] .block,\n  [data-ogsc] .block table[align=center],\n  [data-ogsc] .spacer-block td {\n    background-color: #000000 !important;\n  }\n\n  [data-ogsc] .quote-block,\n  [data-ogsc] .quote-block table[align=center],\n  [data-ogsc] .cta-button-block,\n  [data-ogsc] .cta-button-block table[align=center],\n  [data-ogsc] .caption-panel,\n  [data-ogsc] .highlighted-text-column td[style*=vertical-align],\n  [data-ogsc] .stat-row-column td[style*=vertical-align] {\n    background-color: #000000 !important;\n  }\n\n  [data-ogsc] .social-link table {\n    background-color: #000000 !important;\n  }\n\n  [data-ogsc] a {\n    color: #8DC63F !important;\n  }\n\n  [data-ogsc] .wysiwyg h1,\n  [data-ogsc] .wysiwyg h2,\n  [data-ogsc] .wysiwyg h3,\n  [data-ogsc] .wysiwyg h4,\n  [data-ogsc] .wysiwyg h5,\n  [data-ogsc] .wysiwyg h6,\n  [data-ogsc] .block h1,\n  [data-ogsc] .block h2,\n  [data-ogsc] .block h3,\n  [data-ogsc] .block h4,\n  [data-ogsc] .block h5,\n  [data-ogsc] .block h6,\n  [data-ogsc] .block p,\n  [data-ogsc] .block span,\n  [data-ogsc] .block li,\n  [data-ogsc] .block div,\n  [data-ogsc] .pre-footer-text span,\n  [data-ogsc] .quote-block p,\n  [data-ogsc] .footer-block p {\n    color: #ffffff !important;\n  }\n\n  [data-ogsc] .email-body {\n    color: #ffffff !important;\n    background-color: #000000 !important;\n  }\n\n  [data-ogsc] .button td,\n  [data-ogsc] .button a {\n    background-color: #006837 !important;\n    border-color: #006837 !important;\n    color: #ffffff !important;\n  }\n\n  [data-ogsc] .two-line-cta a,\n  [data-ogsc] .two-line-cta a span {\n    color: #000000 !important;\n  }\n\n  [data-ogsc] .divider p {\n    border-color: #ffffff !important;\n  }\n\n  [data-ogsc] .question-response {\n    background-color: #000000 !important;\n    border-color: #eee !important;\n    color: #ffffff !important;\n  }\n\n  [data-ogsc] .question-response p a {\n    color: #ffffff !important;\n  }\n}\n\n@media (prefers-color-scheme: dark) {\n  .light-only {\n    display: none !important;\n  }\n\n  .dark-only {\n    display: block !important;\n  }\n\n  body,\n  .email-body {\n    color: #ffffff !important;\n    background-color: #000000 !important;\n  }\n\n  a {\n    color: #8DC63F !important;\n  }\n\n  .wysiwyg h1,\n  .wysiwyg h2,\n  .wysiwyg h3,\n  .wysiwyg h4,\n  .wysiwyg h5,\n  .wysiwyg h6,\n  .pre-footer-text span {\n    color: #ffffff !important;\n  }\n\n  .quote-block p,\n  .footer-block p {\n    color: #ffffff !important;\n  }\n\n  /* table[align=center] = the section's outer table only (it carries the\n     authored background inline). Bonus over the old `>` form: it also\n     reaches background-image sections, whose outer table sits under an\n     extra positioning div the child combinator never crossed. */\n  .block,\n  .block table[align=center],\n  .spacer-block td {\n    background-color: #000000 !important;\n  }\n\n  /* Two shapes, and the difference is load-bearing. A column's\n     background-color lands on a td whose class sits on the PARENT div, so it\n     needs the descendant form; a container-background-color lands on the\n     element's OWN classed td, so `.advocacy-box` is bare. `.block` only ever\n     has a table[align=center] descendant form, never td, which is why a\n     column ground is never covered by it (audit 2026-08-15). */\n  .quote-block,\n  .quote-block table[align=center],\n  .cta-button-block,\n  .cta-button-block table[align=center],\n  .caption-panel,\n  .highlighted-text-column td[style*=vertical-align],\n  .stat-row-column td[style*=vertical-align] {\n    background-color: #000000 !important;\n  }\n\n  /* Blocks force a black background above, but much of the catalog authors\n     its text color inline (dark ink on light section colors) — that ink is\n     invisible on black unless overridden here. Exceptions re-assert below. */\n  .block h1,\n  .block h2,\n  .block h3,\n  .block h4,\n  .block h5,\n  .block h6,\n  .block p,\n  .block span,\n  .block li,\n  /* mj-text compiles to a div carrying inline color — text authored without\n     a <p>/<span> wrapper is only reachable here */\n  .block div {\n    color: #ffffff !important;\n  }\n\n  .button td,\n  .button a {\n    background-color: #006837 !important;\n    border-color: #006837 !important;\n    color: #ffffff !important;\n  }\n\n  /* Two-line pills keep their authored colored chips; black text stays\n     readable on both chip colors where forced-white would fail on orange */\n  .two-line-cta a,\n  .two-line-cta a span {\n    color: #000000 !important;\n  }\n\n  .social-link table {\n    background-color: #000000 !important;\n  }\n\n  .divider p {\n    border-color: #ffffff !important;\n  }\n\n  /* Tri-color divider: intentionally NOT adapted — its three brand-color\n     bars (orange/green/teal, authored as spacer td backgrounds) read fine\n     on black. Only the single-color divider above inverts. */\n\n  .question-response {\n    background-color: #000000 !important;\n    border-color: #eee !important;\n    color: #ffffff !important;\n  }\n\n  .question-response p a {\n    color: #ffffff !important;\n  }\n\n  .question-response:hover {\n    background-color: #000000!important;\n    cursor: pointer;\n  }\n}\n\n/* sizing classes for adjustable column widths 50-550px */\n@media only screen and (min-width:600px) {\n  .mj-column-px-50,\n  .moz-text-html .mj-column-px-50 {\n    width: 50px !important;\n    max-width: 50px;\n  }\n\n  .mj-column-px-100,\n  .moz-text-html .mj-column-px-100 {\n    width: 100px !important;\n    max-width: 100px;\n  }\n\n  .mj-column-px-150,\n  .moz-text-html .mj-column-px-150 {\n    width: 150px !important;\n    max-width: 150px;\n  }\n\n  .mj-column-px-200,\n  .moz-text-html .mj-column-px-200 {\n    width: 200px !important;\n    max-width: 200px;\n  }\n\n  .mj-column-px-250,\n  .moz-text-html .mj-column-px-250 {\n    width: 250px !important;\n    max-width: 250px;\n  }\n\n  .mj-column-px-300,\n  .moz-text-html .mj-column-px-300 {\n    width: 300px !important;\n    max-width: 300px;\n  }\n\n  .mj-column-px-350,\n  .moz-text-html .mj-column-px-350 {\n    width: 350px !important;\n    max-width: 350px;\n  }\n\n  .mj-column-px-400,\n  .moz-text-html .mj-column-px-400 {\n    width: 400px !important;\n    max-width: 400px;\n  }\n\n  .mj-column-px-450,\n  .moz-text-html .mj-column-px-450 {\n    width: 450px !important;\n    max-width: 450px;\n  }\n\n  .mj-column-px-500,\n  .moz-text-html .mj-column-px-500 {\n    width: 500px !important;\n    max-width: 500px;\n  }\n\n  .mj-column-px-550,\n  .moz-text-html .mj-column-px-550 {\n    width: 550px !important;\n    max-width: 550px;\n  }\n}\n\n/* Thunderbird and other clients responsive CSS */\n@media only screen and (min-width:600px) {\n  .moz-text-html .mj-column-per-100 {\n    width: 100% !important;\n    max-width: 100%;\n  }\n\n  .moz-text-html .mj-column-per-66-66 {\n    width: 66.66% !important;\n    max-width: 66.66%;\n  }\n\n  .moz-text-html .mj-column-per-33-33 {\n    width: 33.33% !important;\n    max-width: 33.33%;\n  }\n\n  .moz-text-html .mj-column-px-50 {\n    width: 50px !important;\n    max-width: 50px;\n  }\n\n  .moz-text-html .mj-column-px-100 {\n    width: 100px !important;\n    max-width: 100px;\n  }\n\n  .moz-text-html .mj-column-px-150 {\n    width: 150px !important;\n    max-width: 150px;\n  }\n\n  .moz-text-html .mj-column-px-200 {\n    width: 200px !important;\n    max-width: 200px;\n  }\n\n  .moz-text-html .mj-column-px-250 {\n    width: 250px !important;\n    max-width: 250px;\n  }\n\n  .moz-text-html .mj-column-px-300 {\n    width: 300px !important;\n    max-width: 300px;\n  }\n\n  .moz-text-html .mj-column-px-350 {\n    width: 350px !important;\n    max-width: 350px;\n  }\n\n  .moz-text-html .mj-column-px-400 {\n    width: 400px !important;\n    max-width: 400px;\n  }\n\n  .moz-text-html .mj-column-px-450 {\n    width: 450px !important;\n    max-width: 450px;\n  }\n\n  .moz-text-html .mj-column-px-500 {\n    width: 500px !important;\n    max-width: 500px;\n  }\n\n  .moz-text-html .mj-column-px-550 {\n    width: 550px !important;\n    max-width: 550px;\n  }\n}\n\n@media only screen and (max-width:599px) {\n  table.mj-full-width-mobile {\n    width: 100% !important;\n  }\n\n  td.mj-full-width-mobile {\n    width: auto !important;\n  }\n\n  td.mj-full-width-mobile img {\n    height: auto !important;\n  }\n}\n"
      }
    }
  </script>
</head>

<body class="email-body" style="word-spacing:normal;background-color:#ffffff;">
  <div aria-label="PROBE — Outlook dark footer" aria-roledescription="email" role="article" lang="en" dir="auto" style="word-spacing:normal;background-color:#ffffff;">
    <!-- START: Footer Label F1 -->
    <!--[if mso | IE]><table align="center" border="0" cellpadding="0" cellspacing="0" class="text-block-outlook block-outlook" role="presentation" style="width:600px;" width="600" bgcolor="#000000" ><tr><td style="line-height:0px;font-size:0px;mso-line-height-rule:exactly;"><![endif]-->
    <div class="text-block block" style="background:#000000;background-color:#000000;margin:0px auto;max-width:600px;">
      <table align="center" border="0" cellpadding="0" cellspacing="0" role="presentation" style="background:#000000;background-color:#000000;width:100%;">
        <tbody>
